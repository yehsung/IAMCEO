# main·native-redesign 에 올릴 때마다 릴리스와 같은 검사를 돌린다.
# 불안정한 시험이 릴리스 태그를 민 순간에 처음 드러나지 않게 하려는 것이다.
# release-mac.ts --upload 는 이 워크플로(또는 release)가 그 커밋에서 성공했는지 확인한다.
name: ci
on:
  push:
    branches: [main, native-redesign]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:ts
      - name: 단위 시험
        run: bun run test:server
  native:
    # macos-latest 에는 Xcode 26.6(Swift 6.3)까지만 있고 그 컴파일러는 이 코드에서 죽는다. 릴리스를 빌드하는 Xcode 27 이미지를 쓴다.
    # 이 이미지는 GitHub 의 공개 미리보기다. 이미지가 사라지거나 이름이 바뀌어 이 작업이 뜨지 않으면 runs-on 을 고친다.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 출시 앱 호환 검사(scripts/check.sh compat)가 출시 태그의 앱 소스를 git 에서 꺼낸다. 얕은 체크아웃에는 태그가 없다.
          fetch-depth: 0
      - name: Xcode 고르기
        # 릴리스를 빌드하는 것과 같은 Xcode 로 시험한다.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          swift --version
      # 앱 시험 일부는 실제 서버를 bun 으로 띄워 붙는다(ReleaseScenarioTests).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: 네이티브 시험
        run: bash scripts/check.sh swift
      - name: 출시 앱 호환
        # 지금 서버의 실제 응답을 출시한 앱(scripts/compat-decoders/releases.json 의 태그)의 해석 코드로 풀어 본다.
        # Swift 와 bun 이 다 있는 이 작업에서 돈다. 네이티브 시험이 실패해도 결과를 따로 보이게 늘 돌린다.
        if: ${{ !cancelled() }}
        run: bash scripts/check.sh compat

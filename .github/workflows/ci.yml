# main·native-redesign 에 올릴 때와 그 두 가지로 가는 PR 마다 릴리스와 같은 검사를 돌린다.
# 불안정한 시험이 릴리스 태그를 민 순간에 처음 드러나지 않게 하려는 것이다.
# release-mac.ts --upload 는 이 워크플로(또는 release)가 그 커밋에서 성공했는지 확인한다.
# Bun 은 .bun-version 하나에서 읽는다(로컬 릴리스의 DMG 안 데몬, release.yml 의 CLI 자산과 같은 Bun).
# iPhone 시험(check.sh ios)은 여기서 돌리지 않는다: xcode-27 이미지에 어떤 iPhone 시뮬레이터가 있는지 확인하지 못했다.
# 로컬에서만 돈다(check.sh all). 넣으려면 그 이미지의 `xcrun simctl list devices available` 을 먼저 확인한다(docs/releasing.md).
name: ci
on:
  push:
    branches: [main, native-redesign]
  pull_request:
    branches: [main, native-redesign]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Bun 이 .bun-version 과 같은지
        run: test "$(bun --version)" = "$(cat .bun-version)"
      - run: bun install --frozen-lockfile
      - run: bun run check:ts
      - name: 단위 시험
        run: bun run test:server
  native:
    # macos-latest 에는 Xcode 26.6(Swift 6.3)까지만 있고 그 컴파일러는 이 코드에서 죽는다. 릴리스를 빌드하는 Xcode 27 이미지를 쓴다.
    # 이 이미지는 GitHub 의 공개 미리보기다. 이미지가 사라지거나 이름이 바뀌어 이 작업이 뜨지 않으면 runs-on 을 고친다.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 고르기
        # 릴리스를 빌드하는 것과 같은 Xcode 로 시험한다.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          swift --version
      # 앱 시험 일부는 실제 서버를 bun 으로 띄워 붙는다(ReleaseScenarioTests).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: 네이티브 시험
        run: bash scripts/check.sh swift
  apps:
    # 앱 빌드(Mac·iPhone): 로컬 check.sh build 와 같다. 서명 없이 Debug 로 두 앱을 컴파일하고 서버 실행 파일도 만든다.
    # 출시 빌드(release-mac.ts, release-ios.ts)와 같은 Xcode 27.2 이미지를 쓴다.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 고르기
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: 앱 빌드(Mac·iPhone)
        run: bash scripts/check.sh build

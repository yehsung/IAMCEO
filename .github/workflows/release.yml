# v* 태그는 CLI 자산이 있는 draft만 만든다. draft는 latest를 바꾸지 않는다.
# 감독자: 같은 태그를 release-mac.ts --ref vX.Y.Z --upload 로 빌드/서명/공증/첨부,
# DMG와 설치를 확인한 다음 gh release edit vX.Y.Z --draft=false --latest 로 공개한다.
# release-mac.ts --upload --publish 는 확인을 마친 감독자용 선택 경로다.
name: release
on:
  push:
    tags: ["v*"]
  # 실패한 태그를 다시 돌릴 때: gh workflow run release.yml --ref vX.Y.Z (태그가 아니면 버전 확인에서 멈춘다)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compat:
    # 출시 앱 호환(D5): 태그를 미는 순간 지금 서버가 출시한 앱의 해석 코드와 어긋나면 초안을 만들지 않는다.
    # macos-latest 의 Xcode 26.6 컴파일러는 이 코드에서 죽으므로 ci.yml 의 native 작업과 같은 Xcode 27 이미지를 쓴다.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 출시 태그의 앱 소스를 git 에서 꺼낸다. 얕은 체크아웃에는 태그가 없다.
          fetch-depth: 0
      - name: Xcode 고르기
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          swift --version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: 출시 앱 호환
        run: bash scripts/check.sh compat
  release:
    needs: compat
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: 태그와 package.json 버전이 같은지
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "$GITHUB_REF_NAME"
      - run: bun run check:ts
      - name: 단위 시험
        # check.sh supplies IAMCEO_TEST=1, temporary HOME/IAMCEO_HOME, port 0,
        # non-live socket paths and fake provider/core executables.
        run: bun run test:server
      - run: bun run build:release
      - run: test "$(dist/release/iamceo-darwin-arm64 version)" = "${GITHUB_REF_NAME#v}"
      - name: 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/iamceo-darwin-arm64 dist/release/iamceo-darwin-x64 dist/release/SHA256SUMS LICENSE THIRD-PARTY-NOTICES.md --draft --title "$GITHUB_REF_NAME" --generate-notes

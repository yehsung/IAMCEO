# v* 태그를 올리면 맥 두 종류용 실행 파일과 SHA256SUMS 를 만들어 GitHub 릴리스로 낸다. install.sh 는 최신 릴리스를 받는다.
# 릴리스는 타입 검사와 단위 시험이 막는다. herdr 시험(herdr 실행 파일 필요)과 화면 시험(브라우저)은 태그 전에 로컬에서 돌린다.
# 화면 시험은 여기서도 따로 돌려 결과를 남기지만 릴리스를 막지 않는다(러너에서 잠깐의 상태를 놓치거나 WebKit 이 느린 일이 있다).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: 태그와 package.json 버전이 같은지
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "$GITHUB_REF_NAME"
      - run: bun run typecheck
      - name: 단위 시험
        run: bun test $(ls tests/*.test.ts | grep -v -e herdr.test.ts -e browser.test.ts)
      - run: bun run build:release
      - run: test "$(dist/release/iamceo-darwin-arm64 version)" = "${GITHUB_REF_NAME#v}"
      - name: 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/iamceo-darwin-arm64 dist/release/iamceo-darwin-x64 dist/release/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes

  screens:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium webkit
      - name: 화면 시험
        run: bun test tests/browser.test.ts

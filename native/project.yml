name: IAMCEO
options:
  developmentLanguage: ko
  bundleIdPrefix: com.iamceo
  deploymentTarget:
    macOS: '14.0'
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.2.2'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0
targets:
  AttachmentException-macOS:
    type: framework.static
    platform: macOS
    sources: [Sources/AttachmentException]
    settings:
      base:
        PRODUCT_MODULE_NAME: AttachmentException
        PRODUCT_NAME: AttachmentException
        PRODUCT_BUNDLE_IDENTIFIER: com.iamceo.attachmentexception.mac
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/AttachmentException/include
    headers:
      public: [Sources/AttachmentException/include/AttachmentException.h]
  AttachmentException-iOS:
    type: framework.static
    platform: iOS
    sources: [Sources/AttachmentException]
    settings:
      base:
        PRODUCT_MODULE_NAME: AttachmentException
        PRODUCT_NAME: AttachmentException
        PRODUCT_BUNDLE_IDENTIFIER: com.iamceo.attachmentexception.ios
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/AttachmentException/include
    headers:
      public: [Sources/AttachmentException/include/AttachmentException.h]
  IAMCEO-macOS:
    dependencies:
      - package: SwiftTerm
      - target: AttachmentException-macOS
        embed: false
    type: application
    platform: macOS
    sources: [Sources/IAMCEO, Resources/macOS]
    info:
      path: Configuration/macOS-Info.plist
      properties:
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleDisplayName: IAMCEO
        CFBundleURLTypes:
          - CFBundleURLName: com.iamceo.open
            CFBundleURLSchemes: [iamceo]
        LSApplicationCategoryType: public.app-category.productivity
        NSLocalNetworkUsageDescription: 내 Mac의 IAMCEO 서버에 연결합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamceo.native.mac
        PRODUCT_NAME: IAMCEO
        CODE_SIGN_ENTITLEMENTS: Configuration/macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  IAMCEO-iOS:
    dependencies:
      - package: SwiftTerm
      - target: AttachmentException-iOS
        embed: false
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    sources: [Sources/IAMCEO, Resources/iOS]
    info:
      path: Configuration/iOS-Info.plist
      properties:
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleDisplayName: IAMCEO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        IAMCEOPushEnvironment: $(APNS_ENVIRONMENT)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 연결 QR을 읽고, 대화에 붙일 사진을 찍습니다.
        CFBundleURLTypes:
          - CFBundleURLName: com.iamceo.pair
            CFBundleURLSchemes: [iamceo]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSLocalNetworkUsageDescription: 내 Mac의 IAMCEO 서버에 연결합니다.
        NSPhotoLibraryAddUsageDescription: 받은 이미지를 사진 앱에 저장합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yehsung.iamceo
        DEVELOPMENT_TEAM: MQ2KQK37WD
        PRODUCT_NAME: IAMCEO
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.2.2'
        CURRENT_PROJECT_VERSION: '1'
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
schemes:
  IAMCEO-macOS:
    build:
      targets:
        IAMCEO-macOS: all
  IAMCEO-iOS:
    build:
      targets:
        IAMCEO-iOS: all

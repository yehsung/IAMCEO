name: IAMCEO
options:
  developmentLanguage: ko
  bundleIdPrefix: com.iamceo
  deploymentTarget:
    macOS: '14.0'
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.2.4'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # 앱 문구: Resources/Shared/Localizable.xcstrings(한국어 원문이 열쇠, 영어 번역). 빌드가 Swift 의 문구를 뽑아 둔다.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0
targets:
  AttachmentException-macOS:
    type: framework.static
    platform: macOS
    sources: [Sources/AttachmentException]
    settings:
      base:
        PRODUCT_MODULE_NAME: AttachmentException
        PRODUCT_NAME: AttachmentException
        PRODUCT_BUNDLE_IDENTIFIER: com.iamceo.attachmentexception.mac
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/AttachmentException/include
    headers:
      public: [Sources/AttachmentException/include/AttachmentException.h]
  AttachmentException-iOS:
    type: framework.static
    platform: iOS
    sources: [Sources/AttachmentException]
    settings:
      base:
        PRODUCT_MODULE_NAME: AttachmentException
        PRODUCT_NAME: AttachmentException
        PRODUCT_BUNDLE_IDENTIFIER: com.iamceo.attachmentexception.ios
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/AttachmentException/include
    headers:
      public: [Sources/AttachmentException/include/AttachmentException.h]
  IAMCEO-macOS:
    dependencies:
      - package: SwiftTerm
      - target: AttachmentException-macOS
        embed: false
    type: application
    platform: macOS
    sources: [Sources/IAMCEO, Resources/macOS, Resources/Shared]
    info:
      path: Configuration/macOS-Info.plist
      properties:
        # 한국어도 영어도 고르지 않은 기기(일본어만 등)는 영어로(4차 리뷰 lang-6). 문구 표의 원문 언어는 한국어 그대로다.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [ko, en]
        CFBundleDisplayName: IAMCEO
        CFBundleURLTypes:
          - CFBundleURLName: com.iamceo.open
            CFBundleURLSchemes: [iamceo]
        LSApplicationCategoryType: public.app-category.productivity
        NSLocalNetworkUsageDescription: 내 Mac의 IAMCEO 서버에 연결합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamceo.native.mac
        PRODUCT_NAME: IAMCEO
        CODE_SIGN_ENTITLEMENTS: Configuration/macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  IAMCEO-iOS:
    dependencies:
      - package: SwiftTerm
      - target: AttachmentException-iOS
        embed: false
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    sources: [Sources/IAMCEO, Resources/iOS, Resources/Shared]
    info:
      path: Configuration/iOS-Info.plist
      properties:
        # 한국어도 영어도 고르지 않은 기기(일본어만 등)는 영어로(4차 리뷰 lang-6). 문구 표의 원문 언어는 한국어 그대로다.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [ko, en]
        CFBundleDisplayName: IAMCEO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        IAMCEOPushEnvironment: $(APNS_ENVIRONMENT)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 연결 QR을 읽고, 대화에 붙일 사진을 찍습니다.
        CFBundleURLTypes:
          - CFBundleURLName: com.iamceo.pair
            CFBundleURLSchemes: [iamceo]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSLocalNetworkUsageDescription: 내 Mac의 IAMCEO 서버에 연결합니다.
        NSPhotoLibraryAddUsageDescription: 받은 이미지를 사진 앱에 저장합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yehsung.iamceo
        DEVELOPMENT_TEAM: MQ2KQK37WD
        PRODUCT_NAME: IAMCEO
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.2.4'
        CURRENT_PROJECT_VERSION: '1'
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
  # E8: iPhone 에서도 같은 시험(Tests/IAMCEOTests)을 돌린다. `bash scripts/check.sh ios` 가 시뮬레이터로 돌린다.
  # 시험을 품는 앱은 출시 앱과 소스는 같고 번들 ID 만 다른 시험 전용 앱이다. 시뮬레이터에 깔린 출시 앱
  # (com.yehsung.iamceo)의 저장된 연결·키체인을 덮어쓰거나, 시험 중에 그 연결로 실제 서버에 붙지 않게 한다.
  # 모듈 이름은 IAMCEO 그대로라 시험의 `@testable import IAMCEO` 가 그대로 통한다. 출시 빌드(IAMCEO-iOS 계획)는 이 둘을 만들지 않는다.
  IAMCEO-iOS-TestHost:
    dependencies:
      - package: SwiftTerm
      - target: AttachmentException-iOS
        embed: false
    type: application
    platform: iOS
    # 문구 표(Resources/Shared)는 넣지 않는다: 시험은 한국어 원문(열쇠)을 그대로 본다. 시뮬레이터가 영어여도 같다.
    sources: [Sources/IAMCEO, Resources/iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamceo.native.ios.testhost
        PRODUCT_MODULE_NAME: IAMCEO
        INFOPLIST_FILE: Configuration/iOS-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: '1'
        APNS_ENVIRONMENT: development
  IAMCEOTests-iOS:
    type: bundle.unit-test
    platform: iOS
    # 앱 빌드만 하는 곳(scripts/build-native.ts, release-ios.ts, check.sh build)은 Tests 폴더를 복사하지 않는다. 그때도 계획이 만들어지게 둔다.
    sources:
      - path: Tests/IAMCEOTests
        optional: true
    dependencies:
      - target: IAMCEO-iOS-TestHost
      - target: AttachmentException-iOS
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamceo.native.ios.tests
        # SwiftPM 시험(swift test)과 같은 모듈 이름: 시험 이름이 두 곳에서 같게(IAMCEOTests.이름) 찍힌다.
        PRODUCT_MODULE_NAME: IAMCEOTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1'
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/AttachmentException/include
schemes:
  IAMCEO-macOS:
    build:
      targets:
        IAMCEO-macOS: all
  IAMCEO-iOS:
    build:
      targets:
        IAMCEO-iOS: all
  IAMCEO-iOS-Tests:
    build:
      targets:
        IAMCEOTests-iOS: [test]
    test:
      config: Debug
      targets: [IAMCEOTests-iOS]
